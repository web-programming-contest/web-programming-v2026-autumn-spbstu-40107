<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Окно подтверждения</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="overlay">
      <div class="dialog" role="dialog" aria-labelledby="dialog-title">
        <h1 class="dialog-header" id="dialog-title">Подтверждение</h1>
        <p class="dialog-body">Вы действительно хотите удалить этот файл?</p>
        <div class="dialog-footer">
          <button class="btn btn-ok" type="button">OK</button>
          <button class="btn btn-cancel" type="button">Отмена</button>
        </div>
      </div>
    </div>
  </body>
</html>
