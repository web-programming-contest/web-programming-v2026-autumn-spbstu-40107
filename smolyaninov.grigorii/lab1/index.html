<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Кофе в зёрнах</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Кофе в зёрнах</h1>
      <div class="products" aria-label="Каталог товаров" tabindex="0">
        <div class="product-card">
          <img
            src="assets/coffee-1.jpg"
            alt="Обжаренные кофейные зёрна"
            width="200"
            height="150"
          />
          <h2>Кофе в зёрнах</h2>
          <p>Обжаренные зёрна для приготовления кофе.</p>
        </div>
        <div class="product-card">
          <img
            src="assets/coffee-2.jpg"
            alt="Тёмные кофейные зёрна"
            width="200"
            height="150"
          />
          <h2>Тёмная обжарка</h2>
          <p>Кофейные зёрна насыщенной обжарки.</p>
        </div>
        <div class="product-card">
          <img
            src="assets/coffee-3.jpg"
            alt="Кофейные зёрна крупным планом"
            width="200"
            height="150"
          />
          <h2>Кофе для эспрессо</h2>
          <p>Зерновой кофе для чашки эспрессо.</p>
        </div>
      </div>
    </main>
  </body>
</html>
